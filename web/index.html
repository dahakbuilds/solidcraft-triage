<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>solidcraft-triage</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--border:#30363d;--fg:#e6edf3;--dim:#8b949e;--accent:#58a6ff;--green:#3fb950;--red:#f85149;--purple:#a371f7;--yellow:#d29922}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 -apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap;position:sticky;top:0;background:var(--bg);z-index:5}
header h1{font-size:16px;margin:0 8px 0 0;white-space:nowrap}
header h1 span{color:var(--accent)}
input,select,button{background:var(--panel);color:var(--fg);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font:inherit}
input:focus,select:focus{outline:1px solid var(--accent)}
#repo{width:230px}#token{width:200px}#q{flex:1;min-width:160px}
button{cursor:pointer}button:hover{border-color:var(--accent)}
button.primary{background:#1f6feb;border-color:#1f6feb}
#status{color:var(--dim);font-size:12px;white-space:nowrap}
#facets{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--border)}
.chip{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:2px 10px;font-size:12px;cursor:pointer;user-select:none}
.chip.on{border-color:var(--accent);color:var(--accent)}
.chip .ct{color:var(--dim);margin-left:4px}
#stats{padding:8px 16px;color:var(--dim);font-size:12px}
#stats b{color:var(--fg)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{position:sticky;top:0;background:var(--panel);text-align:left;padding:6px 10px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;white-space:nowrap}
td{padding:6px 10px;border-bottom:1px solid #21262d;vertical-align:top}
tr:hover td{background:#161b22}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
.num{color:var(--dim);font-variant-numeric:tabular-nums}
.st{font-size:11px;padding:1px 8px;border-radius:10px;white-space:nowrap}
.st.open{background:#1a7f3733;color:var(--green)}.st.closed{background:#8957e533;color:var(--purple)}
.reason{font-size:11px;color:var(--dim);white-space:nowrap}
.lbl{display:inline-block;font-size:11px;border-radius:10px;padding:1px 8px;margin:1px 3px 1px 0;background:#388bfd22;color:#79c0ff;white-space:nowrap;cursor:pointer}
.lbl.dup{background:#f8514922;color:#ff7b72}.lbl.tri{background:#3fb95022;color:#56d364}.lbl.ver{background:#a371f722;color:#bc8cff}
.cmt{color:var(--dim)}
.date{color:var(--dim);white-space:nowrap;font-variant-numeric:tabular-nums}
#pager{display:flex;gap:10px;align-items:center;justify-content:center;padding:14px}
.err{color:var(--red);padding:16px}
</style>
</head>
<body>
<header>
  <h1>solidcraft<span>-triage</span></h1>
  <input id="repo" value="tangency-labs/solidcraft" spellcheck="false" title="owner/repo">
  <input id="token" type="password" placeholder="gh token (optional)" spellcheck="false">
  <button id="load" class="primary">Load issues</button>
  <input id="q" placeholder="search title / number / labels…">
  <select id="state"><option value="all">all states</option><option value="open">open</option><option value="closed">closed</option></select>
  <select id="reason"><option value="all">any outcome</option><option value="completed">completed</option><option value="not_planned">closed as dup/not-planned</option><option value="none">still triaged</option></select>
  <select id="sort"><option value="updated">sort: updated</option><option value="created">sort: created</option><option value="comments">sort: comments</option><option value="number">sort: number</option></select>
  <span id="status">wasm: loading…</span>
</header>
<div id="facets"></div>
<div id="stats"></div>
<table><thead><tr>
  <th data-sort="number">#</th><th>issue</th><th>labels</th><th data-sort="comments">cmt</th><th data-sort="created">created</th><th data-sort="updated">updated</th><th>closed by</th>
</tr></thead><tbody id="rows"></tbody></table>
<div id="pager"><button id="prev">← prev</button><span id="pageinfo"></span><button id="next">next →</button></div>
<script src="app.js"></script>
</body>
</html>
